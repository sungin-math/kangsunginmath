<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#172b3a" />
    <title>오프라인 | 강성인수학</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f3f6f8; color: #172b3a; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
      main { width: min(100%, 420px); padding: 36px 28px; border: 1px solid #dce4e9; border-radius: 18px; background: #fff; text-align: center; box-shadow: 0 18px 45px rgba(23, 43, 58, .08); }
      img { width: 84px; height: 84px; border-radius: 18px; }
      h1 { margin: 22px 0 10px; font-size: 22px; }
      p { margin: 0; color: #637785; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/icons/icon-192.png" alt="" />
      <h1>인터넷 연결이 필요합니다.</h1>
      <p>연결 상태를 확인한 뒤 다시 시도해 주세요.</p>
    </main>
  </body>
</html>
