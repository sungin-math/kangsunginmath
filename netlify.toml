[build]
  # public/ 안의 파일만 배포합니다.
  # 예전에는 "." 이라 저장소 전체가 서빙되어 SQL 마이그레이션과
  # 학생 실명·성적이 든 파일까지 공개 다운로드가 가능했습니다.
  # 새 파일은 서빙이 필요할 때만 public/에 넣습니다.
  publish = "public"
  functions = "netlify/functions"

  # public/supabase-config.js는 저장소에 없습니다.
  # 빌드할 때 SUPABASE_URL / SUPABASE_ANON_KEY 환경변수로 생성합니다.
  # 환경변수가 비어 있으면 빌드를 실패시킵니다. 조용히 데모 모드로
  # 배포되는 것보다 배포가 멈추는 편이 안전하기 때문입니다.
  # generate-config가 먼저 돌아야 합니다. stamp-version이 만드는 해시에
  # 생성된 supabase-config.js도 포함되기 때문입니다.
  command = "node scripts/generate-config.js && node scripts/stamp-version.js"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_ANON_KEY"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
